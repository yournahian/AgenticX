version: '3.8'

services:
  atomx-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atomx-engage-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DATABASE_URL=postgres://${POSTGRES_USER:-atomx}:${POSTGRES_PASSWORD:-atomx_secure_pass}@atomx-postgres:5432/${POSTGRES_DB:-atomx_db}
    depends_on:
      atomx-postgres:
        condition: service_healthy
    networks:
      - atomx-network

  atomx-postgres:
    image: postgres:16-alpine
    container_name: atomx-engage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atomx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atomx_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-atomx_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atomx} -d ${POSTGRES_DB:-atomx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atomx-network

networks:
  atomx-network:
    driver: bridge

volumes:
  postgres_data:
